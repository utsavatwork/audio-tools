name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::075832309477:role/github-cicd
          aws-region: ap-south-1
      - run: aws s3 sync dist/ s3://audio-tools-site-642 --delete
      - run: aws cloudfront create-invalidation --distribution-id E3OLQQBTB1TA5O --paths "/*"