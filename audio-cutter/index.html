<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- dark background from the first frame in dark mode, before the CSS arrives -->
    <meta name="color-scheme" content="light dark" />
    <title>Audio Cutter - Trim MP3 Online, Free and Private | MP3 Playground</title>
    <meta name="description" content="Trim and cut audio or video files to MP3 or WAV right in your browser. Free, private, no upload." />
    <meta property="og:title" content="Audio Cutter - MP3 Playground" />
    <meta property="og:description" content="Trim audio in your browser. Your files never leave your device." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mp3playground.com/audio-cutter" />
    <meta property="og:image" content="https://mp3playground.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://mp3playground.com/audio-cutter" />
    <link rel="stylesheet" href="/src/style.css">
    <script defer src="https://cloud.umami.is/script.js"
      data-website-id="8af71d82-8c32-4402-bb81-f5dd2caaa414"
      data-domains="mp3playground.com"></script>
  </head>
  <body>
    <nav class="topnav"><a href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> MP3 Playground</a></nav>
    <!-- the tool's markup lives here, not in the script, so the page appears complete -->
    <main id="app">
      <h1>Audio Cutter</h1>
      <p class="sub">Trim audio or video files, or cut a part out, right in your browser. Your files never leave your device.</p>

      <label id="drop" class="drop">
        <input type="file" id="file" accept="audio/*,video/*" hidden />
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
        <span>Drop an audio or video file here, or <u>browse</u></span>
      </label>
      <p id="info" aria-live="polite"></p>

      <div id="editor" hidden>
        <div class="filebar">
          <div class="fileinfo">
            <strong id="file-name"></strong>
            <span id="file-meta"></span>
          </div>
          <button id="change-file" class="link">Change file</button>
        </div>
        <div class="wave">
          <canvas id="wave" width="900" height="160"
            title="Click to move the playhead, drag to select"
            aria-label="Waveform. Click to move the playhead, drag to select a part."
            style="touch-action:none;cursor:ew-resize"></canvas>
          <div id="head" hidden></div>
        </div>
        <div class="times">
          <div class="time">
            <label for="start-time">Start</label>
            <div class="stepper">
              <button data-edge="start" data-step="-0.1" aria-label="Move start back 0.1 seconds">−</button>
              <input id="start-time" type="text" autocomplete="off" spellcheck="false"
                enterkeyhint="done" aria-describedby="time-msg" />
              <button data-edge="start" data-step="0.1" aria-label="Move start forward 0.1 seconds">+</button>
            </div>
            <button class="set link" data-set="start" aria-label="Set start to the playhead" disabled>Set to playhead</button>
          </div>
          <div class="clip">
            <p><span id="clip-label">Clip length</span> <strong id="clip-length"></strong></p>
            <p id="pos"></p>
          </div>
          <div class="time">
            <label for="end-time">End</label>
            <div class="stepper">
              <button data-edge="end" data-step="-0.1" aria-label="Move end back 0.1 seconds">−</button>
              <input id="end-time" type="text" autocomplete="off" spellcheck="false"
                enterkeyhint="done" aria-describedby="time-msg" />
              <button data-edge="end" data-step="0.1" aria-label="Move end forward 0.1 seconds">+</button>
            </div>
            <button class="set link" data-set="end" aria-label="Set end to the playhead" disabled>Set to playhead</button>
          </div>
        </div>
        <p id="time-msg" aria-live="polite"></p>
        <div class="options">
          <fieldset class="mode">
            <legend class="visually-hidden">What to export</legend>
            <label><input type="radio" name="mode" value="keep" checked /> Keep selection</label>
            <label><input type="radio" name="mode" value="remove" /> Remove selection</label>
          </fieldset>
          <div class="fade">
            <label class="switch"><input type="checkbox" id="fade-in" role="switch" /> Fade in</label>
            <select id="fade-in-sec" aria-label="Fade in length" hidden>
              <option value="1">1 s</option>
              <option value="2" selected>2 s</option>
              <option value="3">3 s</option>
              <option value="5">5 s</option>
            </select>
          </div>
          <div class="fade">
            <label class="switch"><input type="checkbox" id="fade-out" role="switch" /> Fade out</label>
            <select id="fade-out-sec" aria-label="Fade out length" hidden>
              <option value="1">1 s</option>
              <option value="2" selected>2 s</option>
              <option value="3">3 s</option>
              <option value="5">5 s</option>
            </select>
          </div>
        </div>
        <div class="toolbar">
          <button id="play"><svg class="icon solid i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg><svg class="icon solid i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg><span id="play-label">Play</span></button>
          <div class="group">
            <select id="format" aria-label="Format">
              <option value="128">MP3 · 128 kbps</option>
              <option value="192" selected>MP3 · 192 kbps</option>
              <option value="320">MP3 · 320 kbps</option>
              <option value="wav">WAV · lossless</option>
            </select>
            <button id="download" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</button>
          </div>
        </div>
        <p id="status" aria-live="polite"></p>
      </div>
    </main>
    <p class="more">More tools are on the way. <a href="/#coming-soon">See what's coming and vote</a></p>
    <footer class="footer">
      Your files never leave your device · <a href="/privacy.html">Privacy</a> ·
      <a href="https://tally.so/r/8NZd4A" target="_blank" rel="noopener">Feedback</a> ·
      <a href="https://github.com/utsavatwork/audio-tools" target="_blank" rel="noopener">GitHub</a>
    </footer>
    <script type="module" src="/src/cutter.ts"></script>
  </body>
</html>
