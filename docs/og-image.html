<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1c1c1b; color: #e9e9e6;
    font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .mark { width: 64px; height: 64px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 64px; font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 14px 0 0; font-size: 30px; color: #8f8f8a; }
  canvas { margin-top: 56px; width: 960px; height: 140px; border-radius: 14px;
    background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" fill="#2a2a29"/>
    <g fill="#e9e9e6">
      <rect x="4.5" y="12" width="3" height="8" rx="1.5"/><rect x="9.5" y="8" width="3" height="16" rx="1.5"/>
      <rect x="14.5" y="5" width="3" height="22" rx="1.5"/><rect x="19.5" y="9" width="3" height="14" rx="1.5"/>
      <rect x="24.5" y="12" width="3" height="8" rx="1.5"/>
    </g>
  </svg>
  <h1>MP3 Playground</h1>
  <p>Simple audio tools in your browser. Nothing is uploaded.</p>
  <canvas id="c" width="960" height="140"></canvas>
<script>
  // a quiet waveform like the cutter's: a selection in mid-grey, the rest faint
  const c = document.getElementById('c'), g = c.getContext('2d'), w = c.width, h = c.height
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  const sx = 330, ex = 640
  g.fillStyle = 'rgba(255,255,255,0.04)'; g.fillRect(sx, 0, ex - sx, h)
  for (let x = 6; x < w - 6; x += 4) {
    const env = 0.3 + 0.55 * Math.abs(Math.sin(x / 70)) * (0.65 + 0.35 * Math.sin(x / 210))
    const a = env * (0.75 + 0.25 * rnd()) * (h / 2 - 10)
    g.fillStyle = x >= sx && x < ex ? '#8a8a86' : '#3a3a38'
    g.fillRect(x, h / 2 - a, 2, a * 2)
  }
  g.fillStyle = '#e9e9e6'; g.fillRect(sx - 1, 0, 2, h); g.fillRect(ex - 1, 0, 2, h)
</script>
</body>
</html>
